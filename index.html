<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student details form</title>
     <link rel="stylesheet" href="student.css">


</head>
<body>
   
<div class="container">

    <form>
        <h2>Shridevi institute of engineering & technology</h2>
        <h3>Student Details Form</h3>


        <label>Student Name:</label>
        <input type="text" placeholder="Enter Name" required><br><br>

        <label>USN:</label>
        <input type="text" placeholder="Enter USN" required><br><br>

        <label>College Name:</label>
        <input type="text" placeholder="Enter College Name" required><br><br>

        <label>Course:</label>
        <input type="text" placeholder="Enter Course" required><br><br>

        <label>Branch:</label>
        <input type="text" placeholder="Enter Branch" required><br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter Email" required><br><br>

        <label>Date of Birth:</label>
        <input type="date" required><br><br>


        <label>State:</label>
        <select required>
            <option value="">Select State</option>
            <option>Karnataka</option>
            <option>Maharashtra</option>
            <option>Tamil Nadu</option>
            <option>Kerala</option>
            <option>Andhra Pradesh</option>
        </select><br><br>


        <label>Phone Number:</label>
        <input type="tel" placeholder="Enter Phone Number" required><br><br>

        <label>Age:</label>
        <input type="number" placeholder="Enter Age" required><br><br>

        <label>Gender:</label>
        <div class="gender">
            <input type="radio" name="gender"> Male<br>
            <input type="radio" name="gender"> Female<br>
            <input type="radio" name="gender"> Other<br>
        </div><br>

        <label>Skills:</label>
        <div class="skills">
            <input type="radio" name="html"> HTML <br>
            <input type="radio" name="css"> CSS <br>
            <input type="radio" name="js"> JavaScript <br>
            <input type="radio" name="java"> Java <br>
            <input type="radio" name="python"> Python
        </div><br><br>

        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>

    </form>
    </div>

</body>
    
</html>
